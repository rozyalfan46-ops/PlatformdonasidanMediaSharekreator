
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALFANSTORE.id - Digital Store</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1020;color:#fff;
 font-family:Arial,sans-serif;
}
header{
 padding:20px;background:#111a30;
 display:flex;justify-content:space-between;
 align-items:center;border-bottom:1px solid #263653;
}
.logo{font-size:22px;font-weight:bold;color:#65b7ff}
nav{padding:12px;display:flex;gap:8px;overflow:auto}
nav button,.item button{
 border:0;border-radius:9px;padding:11px;
 background:#1c2b48;color:white;cursor:pointer;
}
.hero{padding:25px 18px}
.hero h1{font-size:29px;margin-bottom:8px}
.hero p{color:#aab8d0}
.container{padding:15px}
.grid{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:12px;
}
.item{
 background:#151f35;border:1px solid #293b5b;
 border-radius:14px;padding:16px;
}
.item .emoji{font-size:30px}
.item h3{margin:10px 0 5px}
.item p{color:#aab8d0;font-size:13px}
.item button{width:100%;background:#147de0}
.panel{
 background:#151f35;border-radius:14px;
 padding:17px;margin-top:20px;
}
input,select{
 width:100%;padding:13px;margin:8px 0;
 background:#0c1528;color:white;
 border:1px solid #344664;border-radius:8px;
}
.primary{
 width:100%;padding:14px;border:0;
 background:#1687ed;color:white;
 border-radius:9px;font-weight:bold;
}
footer{text-align:center;padding:25px;color:#8291aa}
</style>
</head>
<body>

<header>
 <div class="logo">⚡ ALFANSTORE.id</div>
 <div>Digital Store</div>
</header>

<nav>
 <button onclick="show('game')">Top Up Game</button>
 <button onclick="show('pulsa')">Pulsa</button>
 <button onclick="show('data')">Paket Data</button>
 <button onclick="show('pln')">Token PLN</button>
</nav>

<section class="hero">
 <h1>Top Up & Produk Digital</h1>
 <p>Semua kebutuhan digital dalam satu tempat.</p>
</section>

<main class="container">
 <h2 id="heading">Pilih Produk</h2>
 <div class="grid" id="products"></div>

 <div class="panel">
  <h3>Form Pemesanan</h3>
  <form id="order">
   <input id="product" placeholder="Produk pilihan" readonly required>
   <input id="target" placeholder="ID Game / Nomor HP / ID Pelanggan" required>
   <input id="buyer" type="text" placeholder="Nama pembeli" required>
   <input id="price" type="text" placeholder="Harga" readonly>
   <button class="primary" type="submit">
    Lanjutkan Pesanan
   </button>
  </form>
  <p id="message" style="color:#9eb6d8"></p>
 </div>
</main>

<footer>
 © 2026 ALFANSTORE.id
<br>Digital Store
</footer>

<script>
const catalog={
 game:[
  ["🎮","Mobile Legends","Top Up Diamond",20000],
  ["🔥","Free Fire","Top Up Diamond",15000],
  ["🔫","PUBG Mobile","Top Up UC",25000]
 ],
 pulsa:[
  ["📱","Pulsa 10.000","Pulsa HP",11000],
  ["📱","Pulsa 20.000","Pulsa HP",21000],
  ["📱","Pulsa 50.000","Pulsa HP",51000]
 ],
 data:[
  ["🌐","Paket Data 5GB","Paket internet",18000],
  ["🌐","Paket Data 10GB","Paket internet",30000],
  ["🌐","Paket Data 20GB","Paket internet",50000]
 ],
 pln:[
  ["⚡","Token PLN 20.000","Listrik prabayar",22000],
  ["⚡","Token PLN 50.000","Listrik prabayar",52000],
  ["⚡","Token PLN 100.000","Listrik prabayar",102000]
 ]
};

function show(type){
 const names={
  game:"Top Up Game",
  pulsa:"Pulsa HP",
  data:"Paket Data",
  pln:"Token PLN"
 };
 document.getElementById("heading").textContent=names[type];
 document.getElementById("products").innerHTML=
 catalog[type].map(x=>`
 <div class="item">
  <div class="emoji">${x[0]}</div>
  <h3>${x[1]}</h3>
  <p>${x[2]}</p>
  <button onclick="choose('${x[1]}',${x[3]})">
   Pilih Produk
  </button>
 </div>`).join("");
}

function choose(name,price){
 document.getElementById("product").value=name;
 document.getElementById("price").value=
 "Rp "+price.toLocaleString("id-ID");
}

document.getElementById("order").addEventListener("submit",e=>{
 e.preventDefault();
 document.getElementById("message").textContent=
 "Form berhasil diisi. Sistem pembayaran produksi belum diaktifkan.";
});

show("game");
</script>
</body>
</html>
