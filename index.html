<section id="donate" class="hidden">
  <div class="card">
    <div class="eyebrow">KIRIM DUKUNGAN</div>
    <h2>Dukung <span id="targetName"></span></h2>
    <p class="muted">Setiap dukungan berarti untuk kreator.</p>

    <label>Nama kamu</label>
    <input id="donorName" placeholder="Nama pendukung">

    <label>Jumlah dukungan</label>
    <select id="donationAmount">
      <option value="5000">Rp5.000</option>
      <option value="10000">Rp10.000</option>
      <option value="20000">Rp20.000</option>
      <option value="50000">Rp50.000</option>
    </select>

    <label>Pesan</label>
    <textarea id="donorMessage" placeholder="Tulis pesan dukungan"></textarea>

    <p class="notice">
      Sebelum pembayaran, periksa total akhir. Biaya tambahan dari penyedia pembayaran
      mungkin berlaku dan akan ditampilkan sebelum kamu menyelesaikan transaksi.
    </p>

    <button onclick="demoDonate()">Kirim Dukungan Demo</button>
    <p id="donateMsg" class="notice"></p>
    <button class="secondary" onclick="show('creators')">Kembali</button>
  </div>
</section>
