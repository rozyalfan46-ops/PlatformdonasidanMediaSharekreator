
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DonasiSTMR</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5fa;color:#222;font-family:Arial,sans-serif}
header{background:#5935c5;color:white;padding:17px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:21px;font-weight:bold}
nav{display:flex;gap:7px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:11px 14px;font-weight:bold;cursor:pointer}
nav button{background:white;color:#5935c5}
main{max-width:720px;margin:25px auto;padding:0 14px}
.page{background:white;padding:20px;border-radius:15px;margin-bottom:15px;box-shadow:0 4px 20px #0000000b}
h1{font-size:24px;margin-top:0}
h2{font-size:19px}
p{line-height:1.5}
label{display:block;margin:14px 0 6px;font-weight:bold;font-size:14px}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:16px}
textarea{min-height:80px}
.primary{background:#5935c5;color:white;width:100%;margin-top:15px;padding:14px}
.secondary{background:#eee9ff;color:#5935c5;margin-top:10px}
.hidden{display:none!important}
.muted{color:#777;font-size:14px}
.notice{background:#eaf8ed;color:#21652e;padding:12px;border-radius:9px;margin-top:12px;display:none}
.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.amount{background:white;border:1px solid #ddd}
.amount.active{background:#eee9ff;border-color:#5935c5;color:#5935c5}
.video{position:relative;padding-top:56.25%;background:#222;border-radius:10px;overflow:hidden}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.history{padding:12px;border:1px solid #eee;border-radius:9px;margin:10px 0}
.total{padding:15px;background:#eee9ff;color:#5935c5;border-radius:10px;font-weight:bold}
footer{text-align:center;color:#888;padding:20px;font-size:13px}
</style>
</head>
<body>

<header>
  <div class="logo">DonasiSTMR</div>
  <nav>
    <button onclick="go('home')">Beranda</button>
    <button onclick="go('register')">Daftar</button>
    <button onclick="go('login')">Masuk</button>
    <button onclick="go('dashboard')">Dashboard</button>
  </nav>
</header>

<main>

<section id="home" class="page">
  <h1>Dukung Kreator</h1>
  <p>Platform demo untuk mendukung kreator favoritmu.</p>
  <button class="primary" onclick="go('register')">Daftar sebagai Kreator</button>
  <button class="secondary" onclick="go('login')">Masuk Akun</button>
</section>

<section id="register" class="page hidden">
  <h1>Daftar Kreator</h1>
  <form id="registerForm">
    <label>Nama kreator</label>
    <input id="regName" required maxlength="50">
    <label>Nama pengguna</label>
    <input id="regUser" required pattern="[A-Za-z0-9_-]+" maxlength="24">
    <label>Kata sandi demo</label>
    <input id="regPass" type="password" required minlength="4">
    <label>Link YouTube (opsional)</label>
    <input id="regYoutube" type="url" placeholder="https://youtube.com/watch?v=...">
    <button class="primary">Buat Akun</button>
  </form>
  <div id="registerMsg" class="notice"></div>
</section>

<section id="login" class="page hidden">
  <h1>Masuk Kreator</h1>
  <form id="loginForm">
    <label>Nama pengguna</label>
    <input id="loginUser" required>
    <label>Kata sandi demo</label>
    <input id="loginPass" type="password" required>
    <button class="primary">Masuk</button>
  </form>
  <div id="loginMsg" class="notice"></div>
</section>

<section id="dashboard" class="page hidden">
  <h1>Dashboard Kreator</h1>
  <p id="welcome" class="muted"></p>

  <label>Nama tampilan</label>
  <input id="editName">

  <label>Link video YouTube</label>
  <input id="editYoutube" type="url">

  <button class="primary" onclick="saveProfile()">Simpan Profil</button>

  <label>Link profil kamu</label>
  <input id="profileLink" readonly>
  <button class="secondary" onclick="copyLink()">Salin Link Profil</button>

  <h2>Riwayat Donasi</h2>
  <div class="total" id="total">Total dukungan: Rp0</div>
  <div id="history"></div>

  <button class="secondary" onclick="logout()">Keluar Akun</button>
  <div id="dashMsg" class="notice"></div>
</section>

<section id="creator" class="page hidden">
  <h1 id="creatorName">Dukung Kreator</h1>
  <p class="muted">Tonton video dan kirim dukungan demo.</p>

  <div class="video" id="videoBox"></div>
  <p id="noVideo" class="muted">Kreator belum menambahkan video.</p>

  <label>Nama pendukung</label>
  <input id="donorName" placeholder="Nama atau anonim" maxlength="40">

  <label>Pesan dukungan</label>
  <textarea id="donorMessage" maxlength="200" placeholder="Tulis pesan..."></textarea>

  <label>Pilih nominal</label>
  <div class="amounts">
    <button class="amount active" data-value="5000">Rp5.000</button>
    <button class="amount" data-value="10000">Rp10.000</button>
    <button class="amount" data-value="20000">Rp20.000</button>
  </div>

  <label>Nominal lainnya</label>
  <input id="customAmount" type="number" min="1000" max="1000000" placeholder="Minimal Rp1.000">

  <button class="primary" onclick="donate()">Kirim Donasi Demo</button>
  <div id="donateMsg" class="notice"></div>
</section>

</main>
<footer>DonasiSTMR — Versi Demo</footer>

<script>
const $ = id => document.getElementById(id);

function read(key, fallback) {
  try {
    return JSON.parse(localStorage.getItem(key)) ?? fallback;
  } catch {
    return fallback;
  }
}

function users() {
  return read("dstmr_users", {});
}

function donations() {
  return read("dstmr_donations", {});
}

let current = localStorage.getItem("dstmr_current") || "";
let selected = 5000;
let creator = "";

function message(id, text) {
  $(id).textContent = text;
  $(id).style.display = "block";
}

function go(id) {
  document.querySelectorAll("main > section").forEach(section => {
    section.classList.add("hidden");
  });

  $(id).classList.remove("hidden");

  if (id === "dashboard") loadDashboard();
}

function register(e) {
  e.preventDefault();

  const data = users();
  const username = $("regUser").value.trim().toLowerCase();

  if (data[username]) {
    message("registerMsg", "Nama pengguna sudah digunakan.");
    return;
  }

  data[username] = {
    name: $("regName").value.trim(),
    password: $("regPass").value,
    youtube: $("regYoutube").value.trim()
  };

  localStorage.setItem("dstmr_users", JSON.stringify(data));
  current = username;
  localStorage.setItem("dstmr_current", current);

  $("registerForm").reset();
  go("dashboard");
}

function login(e) {
  e.preventDefault();

  const username = $("loginUser").value.trim().toLowerCase();
  const password = $("loginPass").value;
  const user = users()[username];

  if (!user || user.password !== password) {
    message("loginMsg", "Nama pengguna atau kata sandi salah.");
    return;
  }

  current = username;
  localStorage.setItem("dstmr_current", current);
  $("loginForm").reset();
  go("dashboard");
}

function loadDashboard() {
  const user = users()[current];

  if (!user) {
    $("welcome").textContent = "Silakan masuk atau daftar terlebih dahulu.";
    $("editName").value = "";
    $("editYoutube").value = "";
    $("profileLink").value = "";
    $("total").textContent = "Total dukungan: Rp0";
    $("history").textContent = "Masuk untuk melihat riwayat.";
    return;
  }

  $("welcome").textContent = "Selamat datang, " + user.name;
  $("editName").value = user.name;
  $("editYoutube").value = user.youtube || "";
  $("profileLink").value =
    location.href.split("#")[0] + "#creator=" + encodeURIComponent(current);

  renderHistory();
}

function saveProfile() {
  const data = users();

  if (!data[current]) {
    message("dashMsg", "Silakan masuk terlebih dahulu.");
    return;
  }

  data[current].name = $("editName").value.trim() || current;
  data[current].youtube = $("editYoutube").value.trim();

  localStorage.setItem("dstmr_users", JSON.stringify(data));
  loadDashboard();
  message("dashMsg", "Profil berhasil disimpan.");
}

function copyLink() {
  const link = $("profileLink").value;

  if (!link) return message("dashMsg", "Masuk terlebih dahulu.");

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link)
      .then(() => message("dashMsg", "Link berhasil disalin."))
      .catch(() => message("dashMsg", "Silakan salin link dari kolom."));
  } else {
    message("dashMsg", "Silakan salin link dari kolom.");
  }
}

function logout() {
  current = "";
  localStorage.removeItem("dstmr_current");
  go("home");
}

function renderHistory() {
  const list = donations()[current] || [];
  const total = list.reduce((sum, item) => sum + item.amount, 0);

  $("total").textContent =
    "Total dukungan demo: Rp" + total.toLocaleString("id-ID");

  $("history").innerHTML = "";

  if (!list.length) {
    $("history").textContent = "Belum ada donasi.";
    return;
  }

  [...list].reverse().forEach(item => {
    const div = document.createElement("div");
    div.className = "history";

    const name = document.createElement("strong");
    name.textContent = item.name;

    const amount = document.createElement("p");
    amount.textContent = "Rp" + item.amount.toLocaleString("id-ID");

    const note = document.createElement("p");
    note.textContent = item.message || "Tanpa pesan";

    const date = document.createElement("small");
    date.textContent = item.date;

    div.append(name, amount, note, date);
    $("history").appendChild(div);
  });
}

function youtubeId(url) {
  try {
    const u = new URL(url);

    if (u.hostname.includes("youtu.be"))
      return u.pathname.slice(1).split("/")[0];

    if (u.hostname.includes("youtube.com")) {
      if (u.pathname === "/watch") return u.searchParams.get("v") || "";

      const parts = u.pathname.split("/");
      if (["embed", "shorts"].includes(parts[1])) return parts[2] || "";
    }
  } catch {}

  return "";
}

function openCreator(username) {
  const user = users()[username];

  if (!user) {
    go("home");
    return;
  }

  creator = username;
  $("creatorName").textContent = "Dukung " + user.name;

  const id = youtubeId(user.youtube || "");

  $("videoBox").innerHTML = id
    ? '<iframe src="https://www.youtube-nocookie.com/embed/' +
      encodeURIComponent(id) +
      '" allowfullscreen title="Video kreator"></iframe>'
    : "";

  $("noVideo").style.display = id ? "none" : "block";
  $("donorName").value = "";
  $("donorMessage").value = "";
  $("customAmount").value = "";
  $("donateMsg").style.display = "none";

  selected = 5000;

  document.querySelectorAll(".amount").forEach(button => {
    button.classList.toggle(Number(button.dataset.value) === selected);
  });

  go("creator");
}

document.querySelectorAll(".amount").forEach(button => {
  button.addEventListener("click", () => {
    selected = Number(button.dataset.value);
    $("customAmount").value = "";

    document.querySelectorAll(".amount").forEach(b => {
      b.classList.toggle("active", b === button);
    });
  });
});

$("customAmount").addEventListener("input", () => {
  document.querySelectorAll(".amount").forEach(b => b.classList.remove("active"));
});

function donate() {
  if (!creator || !users()[creator]) {
    message("donateMsg", "Kreator tidak ditemukan.");
    return;
  }

  const amount = $("customAmount").value
    ? Number($("customAmount").value)
    : selected;

  if (!Number.isInteger(amount) || amount < 1000 || amount > 1000000) {
    message("donateMsg", "Nominal minimal Rp1.000 dan maksimal Rp1.000.000.");
    return;
  }

  const all = donations();

  if (!all[creator]) all[creator] = [];

  all[creator].push({
    name: $("donorName").value.trim() || "Anonim",
    message: $("donorMessage").value.trim(),
    amount: amount,
    date: new Date().toLocaleString("id-ID")
  });

  localStorage.setItem("dstmr_donations", JSON.stringify(all));

  message(
    "donateMsg",
    "Donasi demo Rp" + amount.toLocaleString("id-ID") +
    " berhasil dicatat. Tidak ada uang yang dibayarkan."
  );
}

$("registerForm").addEventListener("submit", register);
$("loginForm").addEventListener("submit", login);

function checkLink() {
  const match = location.hash.match(/^#creator=(.+)$/);

  if (match) {
    try {
      openCreator(decodeURIComponent(match[1]));
    } catch {
      go("home");
    }
  } else {
    go("home");
  }
}

window.addEventListener("hashchange", checkLink);
checkLink();
</script>

</body>
</html>
