
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donasiku - Media Share</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#081426;color:#f4f7fb;font-family:Arial,sans-serif}
header{padding:22px;background:#10233b;border-bottom:1px solid #25435c}
.logo{font-size:27px;font-weight:bold;color:#54e0c0}
.logo span{color:#ffad55}
main{max-width:850px;margin:25px auto;padding:15px}
.card{background:#10233b;padding:20px;border-radius:16px;margin-bottom:18px}
h1{font-size:27px;margin-top:5px}
h2{font-size:19px}
p{color:#b8c8d9;line-height:1.5}
input,textarea{width:100%;padding:13px;margin:7px 0 13px;border:1px solid #34516b;border-radius:9px;background:#091a2d;color:white;font-size:15px}
textarea{min-height:85px}
button{border:0;border-radius:9px;padding:13px 17px;background:#54e0c0;color:#082034;font-weight:bold;font-size:15px;cursor:pointer}
.amounts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 15px}
.amounts button{background:#203c56;color:white}
.amounts button.active{background:#54e0c0;color:#082034}
.video{width:100%;aspect-ratio:16/9;background:#020812;border-radius:12px;overflow:hidden}
iframe{width:100%;height:100%;border:0}
.alert{background:#183e48;padding:15px;border-radius:10px;margin-top:15px;display:none}
.small{font-size:12px;color:#91a6ba}
a{color:#54e0c0}
</style>
</head>
<body>
<header>
 <div class="logo">dona<span>siku</span></div>
 <p>Dukung kreator. Bagikan semangat.</p>
</header>

<main>
 <section class="card">
  <h1>Media Share 🎬</h1>
  <p>Kirim dukungan dan bagikan video YouTube favoritmu kepada kreator.</p>
  <div class="video" id="videoBox">
   <p style="text-align:center;padding-top:25%">Video akan tampil di sini</p>
  </div>
  <p id="videoStatus" class="small">Belum ada video yang dipilih.</p>
 </section>

 <section class="card">
  <h2>Kirim donasi</h2>
  <label>Nama kamu</label>
  <input id="nama" placeholder="Masukkan nama">

  <label>Nominal donasi</label>
  <div class="amounts">
   <button type="button" onclick="pilih(5000,this)">Rp5.000</button>
   <button type="button" onclick="pilih(10000,this)">Rp10.000</button>
   <button type="button" onclick="pilih(20000,this)">Rp20.000</button>
   <button type="button" onclick="pilih(50000,this)">Rp50.000</button>
  </div>

  <label>Pesan untuk kreator</label>
  <textarea id="pesan" placeholder="Tulis pesan dukungan..."></textarea>

  <label>Link video YouTube</label>
  <input id="youtube" placeholder="https://youtu.be/...">

  <button type="button" onclick="kirim()" style="width:100%">Kirim donasi (simulasi)</button>
  <p class="small">Demo ini belum menerima pembayaran sungguhan.</p>

  <div class="alert" id="alert"></div>
 </section>

 <section class="card">
  <h2>Aktivitas dukungan</h2>
  <div id="aktivitas"><p>Belum ada dukungan.</p></div>
 </section>
</main>

<script>
let nominal=5000;

function pilih(jumlah,tombol){
 nominal=jumlah;
 document.querySelectorAll('.amounts button').forEach(b=>b.classList.remove('active'));
 tombol.classList.add('active');
}

function getVideoID(url){
 try{
  const u=new URL(url);
  if(u.hostname.includes('youtu.be')) return u.pathname.slice(1);
  if(u.hostname.includes('youtube.com')){
   if(u.searchParams.get('v')) return u.searchParams.get('v');
   const parts=u.pathname.split('/');
   if(['embed','shorts','live'].includes(parts[1])) return parts[2];
  }
 }catch(e){}
 return null;
}

function kirim(){
 const nama=document.getElementById('nama').value.trim()||'Anonim';
 const pesan=document.getElementById('pesan').value.trim();
 const link=document.getElementById('youtube').value.trim();
 const id=getVideoID(link);

 if(link&&!id){
  alert('Link YouTube tidak valid.');
  return;
 }

 if(id){
  document.getElementById('videoBox').innerHTML=
   '<iframe src="https://www.youtube.com/embed/'+encodeURIComponent(id)+'?playsinline=1&rel=0" allowfullscreen></iframe>';
  document.getElementById('videoStatus').textContent='Video pilihan: '+id;
 }else{
  document.getElementById('videoBox').innerHTML=
   '<p style="text-align:center;padding-top:25%">Tidak ada video yang dipilih</p>';
  document.getElementById('videoStatus').textContent='Donasi tanpa Media Share';
 }

 const alertBox=document.getElementById('alert');
 alertBox.style.display='block';
 alertBox.innerHTML='<strong>Terima kasih, '+aman(nama)+'!</strong><br>Donasi simulasi Rp'+nominal.toLocaleString('id-ID')+'<br>'+aman(pesan);

 const aktivitas=document.getElementById('aktivitas');
 if(aktivitas.innerHTML.includes('Belum ada')) aktivitas.innerHTML='';
 const item=document.createElement('p');
 item.textContent=nama+' mendukung Rp'+nominal.toLocaleString('id-ID');
 aktivitas.prepend(item);
}

function aman(teks){
 return teks.replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
 });
}
</script>
</body>
</html>
