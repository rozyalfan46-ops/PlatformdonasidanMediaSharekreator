

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALFANSTORE.id - Top Up Game</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080d19;
  color: white;
}

header {
  padding: 20px;
  background: #111a2e;
  border-bottom: 1px solid #263653;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 23px;
  font-weight: bold;
}

.logo span {
  color: #22d3ee;
}

.badge {
  color: #22d3ee;
  font-size: 12px;
}

.hero {
  margin: 20px;
  padding: 30px 20px;
  border-radius: 18px;
  background: linear-gradient(120deg,#24134d,#123b58);
}

.hero h1 {
  font-size: 30px;
}

.hero p {
  color: #c5d1e5;
}

.container {
  padding: 20px;
  max-width: 800px;
  margin: auto;
}

h2 {
  font-size: 20px;
}

.games {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
}

.game {
  background: #15213a;
  border: 1px solid #344563;
  border-radius: 12px;
  padding: 15px 5px;
  color: white;
  cursor: pointer;
}

.game.active {
  border: 2px solid #22d3ee;
  background: #103047;
}

.game span {
  display: block;
  font-size: 27px;
  margin-bottom: 7px;
}

.panel {
  margin-top: 20px;
  padding: 20px;
  background: #111a2e;
  border: 1px solid #263653;
  border-radius: 15px;
}

label {
  display: block;
  margin: 15px 0 7px;
  color: #c5d1e5;
}

input {
  width: 100%;
  padding: 13px;
  background: #080d19;
  border: 1px solid #344563;
  border-radius: 9px;
  color: white;
  font-size: 15px;
}

.nominals {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
}

.nominal {
  background: #0b1425;
  border: 1px solid #344563;
  color: white;
  padding: 13px;
  border-radius: 10px;
  cursor: pointer;
  text-align: left;
}

.nominal.active {
  border: 2px solid #22d3ee;
  background: #103047;
}

.nominal small {
  display: block;
  color: #9aa9c2;
  margin-top: 5px;
}

.price {
  color: #22d3ee;
  font-size: 22px;
  font-weight: bold;
  margin-top: 15px;
}

.checkout {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: linear-gradient(90deg,#7c3aed,#2563eb);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.checkout:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.result {
  display: none;
  margin-top: 15px;
  padding: 15px;
  background: #10352d;
  border: 1px solid #16805d;
  border-radius: 10px;
  color: #a7f3d0;
}

footer {
  text-align: center;
  padding: 25px;
  color: #9aa9c2;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">ALFANSTORE<span>.id</span></div>
  <div class="badge">⚡ TOP UP GAME</div>
</header>

<section class="hero">
  <h1>TOP UP GAME FAVORITMU</h1>
  <p>Cepat, mudah, dan praktis bersama ALFANSTORE.id</p>
</section>

<div class="container">

<h2>1. Pilih Game</h2>

<div class="games">
  <button class="game active" data-game="Mobile Legends">
    <span>⚔️</span>Mobile Legends
  </button>

  <button class="game" data-game="Free Fire">
    <span>🔥</span>Free Fire
  </button>

  <button class="game" data-game="PUBG Mobile">
    <span>🎯</span>PUBG Mobile
  </button>
</div>

<div class="panel">

<h2>2. Data Akun</h2>

<label>User ID</label>
<input id="player" placeholder="Masukkan User ID">

<label>Server / Zone ID</label>
<input id="server" placeholder="Masukkan Server ID jika diperlukan">

<h2>3. Pilih Nominal</h2>

<div class="nominals" id="nominals"></div>

<div class="price" id="price">Pilih nominal dahulu</div>

<button class="checkout" id="checkout" disabled>
  BUAT PESANAN DEMO
</button>

<div class="result" id="result"></div>

<p style="color:#9aa9c2;font-size:12px">
  Mode demo. Belum ada pembayaran atau pengiriman diamond sungguhan.
</p>

</div>
</div>

<footer>
© 2026 ALFANSTORE.id<br>
Top Up Game • Dark Gaming Store
</footer>

<script>
const products = {
  "Mobile Legends": [
    ["5 Diamonds",1500],
    ["12 Diamonds",3500],
    ["28 Diamonds",8000],
    ["86 Diamonds",22000],
    ["172 Diamonds",43000],
    ["257 Diamonds",64000]
  ],

  "Free Fire": [
    ["5 Diamonds",1000],
    ["12 Diamonds",2000],
    ["50 Diamonds",7000],
    ["70 Diamonds",10000],
    ["140 Diamonds",19000],
    ["355 Diamonds",47000]
  ],

  "PUBG Mobile": [
    ["60 UC",15000],
    ["120 UC",29000],
    ["325 UC",75000],
    ["660 UC",145000],
    ["1800 UC",370000]
  ]
};

let currentGame = "Mobile Legends";
let selected = null;

function rupiah(number) {
  return "Rp " + number.toLocaleString("id-ID");
}

function renderProducts() {
  const area = document.getElementById("nominals");
  area.innerHTML = "";
  selected = null;

  document.getElementById("price").textContent =
    "Pilih nominal dahulu";

  document.getElementById("checkout").disabled = true;

  products[currentGame].forEach(product => {
    const button = document.createElement("button");
    button.className = "nominal";

    button.innerHTML =
      `<strong>${product[0]}</strong>
       <small>${rupiah(product[1])}</small>`;

    button.onclick = () => {
      document.querySelectorAll(".nominal")
        .forEach(item => item.classList.remove("active"));

      button.classList.add("active");

      selected = product;

      document.getElementById("price").textContent =
        rupiah(product[1]);

      document.getElementById("checkout").disabled = false;
      document.getElementById("result").style.display = "none";
    };

    area.appendChild(button);
  });
}

document.querySelectorAll(".game").forEach(button => {
  button.onclick = () => {
    document.querySelectorAll(".game")
      .forEach(item => item.classList.remove("active"));

    button.classList.add("active");
    currentGame = button.dataset.game;

    renderProducts();
  };
});

document.getElementById("checkout").onclick = () => {
  const player = document.getElementById("player").value.trim();
  const server = document.getElementById("server").value.trim();

  if (!player || !selected) {
    alert("Masukkan User ID dan pilih nominal.");
    return;
  }

  const orderId = "AFS-" + Date.now().toString().slice(-8);

  const result = document.getElementById("result");

  result.style.display = "block";

  result.innerHTML = `
    <strong>Pesanan Demo Berhasil Dibuat!</strong><br><br>
    Nomor: ${orderId}<br>
    Game: ${currentGame}<br>
    Produk: ${selected[0]}<br>
    User ID: ${player}<br>
    Server: ${server || "-"}<br>
    Total: ${rupiah(selected[1])}<br><br>
    <small>Ini hanya simulasi, bukan transaksi sungguhan.</small>
  `;
};

renderProducts();
</script>

</body>
</html>
